name: cli
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/check-repository.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
  contract:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abruption/session-peer
          ref: 8ca77cf31254c8287a2593fe484bb30a7dba2727
          path: .reference-python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          SESSION_PEER_PYTHON_ROOT: ${{ github.workspace }}/.reference-python
      - run: npm run test:package
      - name: Exercise release packaging without publishing or credentials
        run: node scripts/release.mjs pack && node scripts/release.mjs artifact
      - run: npm audit
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:windows
      - run: npm run test:package
      - run: npm audit
  release-gate:
    name: release gate
    if: always()
    needs: [repository-policy, contract, windows-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          POLICY: ${{ needs.repository-policy.result }}
          CONTRACT: ${{ needs.contract.result }}
          WINDOWS: ${{ needs.windows-native.result }}
        run: test "$POLICY" = success && test "$CONTRACT" = success && test "$WINDOWS" = success
