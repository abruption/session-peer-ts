name: cli
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/check-repository.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
  contract:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abruption/session-peer
          ref: 47c23713d0a2a3c11ebde6186afd8c43489b8b65
          path: .reference-python
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          SESSION_PEER_PYTHON_ROOT: ${{ github.workspace }}/.reference-python
      - run: npm run test:package
      - run: npm audit
  release-gate:
    name: release gate
    if: always()
    needs: [repository-policy, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          POLICY: ${{ needs.repository-policy.result }}
          CONTRACT: ${{ needs.contract.result }}
        run: test "$POLICY" = success && test "$CONTRACT" = success
