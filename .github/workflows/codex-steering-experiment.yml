name: Codex steering experiment

on:
  pull_request:
    paths:
      - 'experiments/codex_steering/**'
      - '.github/workflows/codex-steering-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    name: Fixtures (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: experiments/codex_steering
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
        env:
          TASK_TEMP: ${{ runner.temp }}/codex-steering-fixtures
      - run: npm audit
